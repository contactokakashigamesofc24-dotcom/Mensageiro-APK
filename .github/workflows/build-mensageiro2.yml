name: Compilar Mensageiro 2 — etapa 3 inspeção somente leitura
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mensageiro-2-fonte-salas-publicas.zip'
      - '.github/workflows/build-mensageiro2.yml'
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto Mensageiro 2
        run: python3 -m zipfile -e mensageiro-2-fonte-salas-publicas.zip .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK
        run: gradle assembleDebug
      - name: Publicar APK direto em Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.2.9-configuracoes-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk#Mensageiro-2.apk \
            --title "Mensageiro — configurações locais (${GITHUB_RUN_NUMBER})" \
            --notes 'Configurações locais: sair da conta neste aparelho, ajuste de tamanho do texto, atalho às permissões de notificação do Android e limpeza confirmada de arquivos temporários. Não inclui push de mensagens, integração funcional do Bot, nem alterações no backend. APK debug compilado pelo GitHub Actions; testar antes de uso.' \
            --prerelease
