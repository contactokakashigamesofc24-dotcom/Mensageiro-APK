name: Compilar Mensageiro 2 — salas públicas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mensageiro-2-fonte-salas-publicas.zip'
      - '.github/workflows/build-mensageiro2.yml'
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto Mensageiro 2
        run: python3 -m zipfile -e mensageiro-2-fonte-salas-publicas.zip .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK
        run: gradle assembleDebug
      - name: Publicar APK direto em Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.2.1-configuracoes-bot app/build/outputs/apk/debug/app-debug.apk#Mensageiro-2.apk \
            --title 'Mensageiro — configurações do bot' \
            --notes 'Remove o controle global quebrado que chamava um campo ausente no Nhost e apresenta o espaço inicial do bot nas Configurações. Não modifica regras das salas nem o backend; o bot ainda não está operacional. Mantém identificador do app principal Mensageiro.' \
            --prerelease
