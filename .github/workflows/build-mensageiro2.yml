name: Compilar Mensageiro 2 — salas públicas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mensageiro-2-fonte-salas-publicas.zip'
      - '.github/workflows/build-mensageiro2.yml'
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto Mensageiro 2
        run: python3 -m zipfile -e mensageiro-2-fonte-salas-publicas.zip .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK
        run: gradle assembleDebug
      - name: Publicar APK direto em Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.3-nome-mensageiro app/build/outputs/apk/debug/app-debug.apk#Mensageiro-2.apk \
            --title 'Mensageiro — nome corrigido' \
            --notes 'O nome exibido no ícone do app agora é Mensageiro, sem o número 2. O identificador Android continua separado para coexistir com o app original. Nenhuma alteração foi feita às salas ou ao backend Nhost.' \
            --prerelease
