name: Compilar Mensageiro — integração UnifiedPush (preparação)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto Mensageiro 2
        run: python3 -m zipfile -e mensageiro-2-fonte-salas-publicas.zip .
      - name: Preparar chave de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-keystore.p12
          chmod 600 app/release-keystore.p12
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK com assinatura fixa
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleDebug
      - name: Publicar APK de preparação para teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.2.11-unifiedpush-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk#Mensageiro-UnifiedPush.apk \
            --title "Mensageiro — integração UnifiedPush (${GITHUB_RUN_NUMBER})" \
            --notes 'APK de preparação da integração Android UnifiedPush: guarda o endpoint com proteção e usa rotas do backend ainda não implantado. A entrega de notificações não está ativa. Não confundir build com teste real no aparelho ou ativação do servidor.' \
            --prerelease
      - name: Guardar artefato de validação
        uses: actions/upload-artifact@v4
        with:
          name: mensageiro-unifiedpush-preparacao
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
