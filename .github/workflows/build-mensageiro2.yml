name: Compilar Mensageiro 2 — etapa 3 inspeção somente leitura
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mensageiro-2-fonte-salas-publicas.zip'
      - '.github/workflows/build-mensageiro2.yml'
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto Mensageiro 2
        run: python3 -m zipfile -e mensageiro-2-fonte-salas-publicas.zip .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK
        run: gradle assembleDebug
      - name: Publicar APK direto em Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.2.8-leitura-permissoes app/build/outputs/apk/debug/app-debug.apk#Mensageiro-2.apk \
            --title 'Mensageiro — etapa 3: inspeção somente leitura' \
            --notes 'Etapa 3: adiciona inspeção GraphQL somente de leitura para verificar se a conta user expõe mutação de inserção. Não lê linhas nem grava dados; Worker sem autorização de publicação. Respostas automáticas continuam desligadas.' \
            --prerelease
